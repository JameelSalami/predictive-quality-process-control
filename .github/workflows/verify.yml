name: Study source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Install independent NumPy challenger
        run: python -m pip install -r projects/fixture-load-path-structural-verification/analysis/falsification/requirements.txt
      - name: Reproduce post-hoc DED comparator
        run: npm run study:ded:falsify
      - name: Validate no-leakage and falsification checks
        run: npm run test:ded:falsify
